[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-iot-health-monitoring"
version = "1.0.0"
description = "RAG-Enhanced IoT Health Monitoring & Explainable Feedback System"
authors = [
    { name = "Ronanki Tagore", email = "tagore@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.28.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "google-generativeai>=0.8.0",
    "gradio>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src",
]

[tool.ruff]
line-length = 100
target-version = "py310"
